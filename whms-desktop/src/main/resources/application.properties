# =========================================================
# WHMS Desktop - Konfigurimi i Aplikacionit
# Baze te dhenash e integruar (H2) - skedar lokal, PA server te jashtem, PA internet.
# Skedari i bazes se te dhenave krijohet automatikisht ne dosjen "whms-data"
# ne te njejtin vend ku ndodhet aplikacioni (whms.jar / whms.exe).
# =========================================================

server.port=0
# E RENDESISHME: '0' do te thote qe sistemi operativ zgjedh VETE nje port te lire, automatikisht,
# cdo here qe aplikacioni niset. Kjo eliminon PERGJITHMONE gabimet "port already in use" -
# pavaresisht cfare tjeter po punon ne kompjuterin e klientit. Aplikacioni e gjen vete portin
# e sakte qe iu caktua dhe hap shfletuesin automatikisht atje (shiko WhmsApplication.java).
server.address=127.0.0.1

# ---------- Baza e te dhenave H2 (skedar lokal) ----------
# E RENDESISHME: perdorim ${user.home} (dosja personale e perdoruesit, p.sh. C:\Users\Emri)
# NE VEND TE nje rruge relative si "./whms-data". Kjo eshte kritike sepse nese aplikacioni
# instalohet ne "C:\Program Files\...", ajo dosje eshte e MBROJTUR nga Windows - perdoruesit
# normale (pa "Run as Administrator") NUK kane leje te shkruajne atje, dhe aplikacioni deshton
# te niset. Dosja personale e perdoruesit eshte gjithmone e shkrueshme, pavaresisht te drejtave.
spring.datasource.url=jdbc:h2:file:${user.home}/PallatiDasmave/whms-data/whmsdb;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.username=whms
spring.datasource.password=whms
spring.datasource.driver-class-name=org.h2.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# E RENDESISHME: mbahet 'true' (parazgjedhja e Spring Boot) sepse faqet Thymeleaf lexojne
# koleksione te ngarkuara "lazy" (p.sh. ushqimet e nje menuje, sherbimet/pagesat e nje rezervimi)
# direkt gjate shfaqjes se faqes. Nese vendoset 'false', shfaqet gabim 500 (LazyInitializationException).
spring.jpa.open-in-view=true

# Konsola H2 (vetem per debug gjate zhvillimit - FSHIJENI ose vendoseni 'false' para se t'ia dorezoni blerësit)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=true

# ---------- Upload ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- Lokalizimi ----------
spring.mvc.locale=sq_MK
spring.mvc.locale-resolver=fixed

# ---------- Emri i aplikacionit (shfaqet ne logje) ----------
spring.application.name=WHMS Desktop
