<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>fragments</title></head>
<body>

<th:block th:fragment="assets">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="_csrf" th:content="${_csrf?.token}"/>
  <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</th:block>

<div th:fragment="sidebar(active)" class="sidebar no-print">
  <div class="brand">
    <div class="seal">PD</div>
    <div class="brand-text">
      <div class="bn" th:text="${businessName != null ? businessName : 'Pallati i Dasmave'}">Pallati i Dasmave</div>
      <div class="bs">Menaxhim Sallash</div>
    </div>
  </div>
  <div class="nav">
    <div class="nav-group-label">Pergjithesi</div>
    <a class="nav-item" th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/}"><span class="ic">&#9670;</span>Paneli</a>

    <div class="nav-group-label">Operacione</div>
    <a class="nav-item" th:classappend="${active == 'halls'} ? 'active'" th:href="@{/halls}"><span class="ic">&#9634;</span>Sallat</a>
    <a class="nav-item" th:classappend="${active == 'reservations'} ? 'active'" th:href="@{/reservations}"><span class="ic">&#9998;</span>Rezervimet</a>
    <a class="nav-item" th:classappend="${active == 'seating'} ? 'active'" th:href="@{/seating}"><span class="ic">&#9638;</span>Plani i Uljes</a>
    <a class="nav-item" th:classappend="${active == 'search'} ? 'active'" th:href="@{/search}"><span class="ic">&#8981;</span>Kerkimi</a>

    <div class="nav-group-label">Financa</div>
    <a class="nav-item" th:classappend="${active == 'menus'} ? 'active'" th:href="@{/menus}"><span class="ic">&#9776;</span>Menute</a>
    <a class="nav-item" th:classappend="${active == 'expenses'} ? 'active'" th:href="@{/expenses}"><span class="ic">&#9662;</span>Shpenzimet</a>

    <div class="nav-group-label">Sistemi</div>
    <a class="nav-item" th:classappend="${active == 'settings'} ? 'active'" th:href="@{/settings/profile}"><span class="ic">&#9881;</span>Cilesimet</a>
  </div>
  <div class="sidebar-foot">
    <div class="user-row" sec:authorize="isAuthenticated()">
      &#128100; <span sec:authentication="name">admin</span>
    </div>
    <form th:action="@{/logout}" method="post">
      <button class="btn btn-ghost btn-sm logout-btn" type="submit">Dilni</button>
    </form>
  </div>
</div>

<th:block th:fragment="alerts">
  <div class="alert-success no-print" th:if="${successMsg}" th:text="${successMsg}"></div>
  <div class="alert-error no-print" th:if="${errorMsg}" th:text="${errorMsg}"></div>
</th:block>

</body>
</html>
