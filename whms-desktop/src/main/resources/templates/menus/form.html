<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/common :: assets}"></th:block>
  <title>Menu — Pallati i Dasmave</title>
</head>
<body>
<div id="appShell">
  <div th:replace="~{fragments/common :: sidebar('menus')}"></div>
  <div class="main">
    <div class="topbar no-print">
      <div><h2 th:text="${menu.id != null ? 'Ndrysho Menunë' : 'Menu e Re'}"></h2></div>
      <a class="btn btn-ghost btn-sm" th:href="@{/menus}">← Kthehu te Menutë</a>
    </div>
    <div class="content" style="max-width:640px;">
      <div class="card">
        <form th:action="@{/menus/save}" method="post">
          <input type="hidden" name="id" th:value="${menu.id}"/>
          <div class="field"><label>Emri i Menusë</label><input type="text" name="name" th:value="${menu.name}" required="required"/></div>
          <div class="field"><label>Përshkrimi</label><textarea name="description" rows="2" th:text="${menu.description}"></textarea></div>
          <div class="row">
            <div class="field"><label>Çmimi për Mysafir (€)</label><input type="number" step="0.01" min="0" name="pricePerGuest" th:value="${menu.pricePerGuest}" required="required"/></div>
            <div class="field"><label>Statusi</label>
              <select id="activeSelect">
                <option value="true" th:selected="${menu.active}">Aktive</option>
                <option value="false" th:selected="${!menu.active}">Joaktive</option>
              </select>
              <input type="hidden" id="activeHidden" name="active" value="true"/>
            </div>
          </div>
          <div class="section-label">Lista e Ushqimeve (një artikull për rresht)</div>
          <textarea name="foodsText" rows="6" th:text="${foodsText}"></textarea>
          <div class="section-label">Lista e Pijeve (një artikull për rresht)</div>
          <textarea name="beveragesText" rows="4" th:text="${beveragesText}"></textarea>
          <div style="margin-top:16px;">
            <button class="btn btn-primary" type="submit">Ruaj</button>
            <a class="btn btn-ghost" th:href="@{/menus}">Anulo</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
  // Sinkronizon selektorin "Statusi" me fushen reale te fshehur qe dergohet ne server (boolean si string)
  const sel = document.getElementById('activeSelect');
  const hidden = document.getElementById('activeHidden');
  function syncActive(){ hidden.value = sel.value; }
  sel.addEventListener('change', syncActive);
  syncActive();
</script>
</body>
</html>
