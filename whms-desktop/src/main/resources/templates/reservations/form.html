<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/common :: assets}"></th:block>
  <title>Rezervim i Ri — Pallati i Dasmave</title>
</head>
<body>
<div id="appShell">
  <div th:replace="~{fragments/common :: sidebar('reservations')}"></div>
  <div class="main">
    <div class="topbar no-print">
      <div><h2>Rezervim i Ri</h2></div>
      <a class="btn btn-ghost btn-sm" th:href="@{/reservations}">← Kthehu te Rezervimet</a>
    </div>
    <div class="content" style="max-width:640px;">
      <div class="card" th:if="${#lists.isEmpty(halls)}">
        <div class="empty">Krijoni së pari të paktën një sallë para se të bëni rezervime. <br/><a class="btn btn-primary" style="margin-top:10px;" th:href="@{/halls/new}">+ Shto Sallë</a></div>
      </div>

      <div class="card" th:if="${not #lists.isEmpty(halls)}">
        <form th:action="@{/reservations/save}" method="post">
          <div class="section-label">Të Dhënat e Klientit</div>
          <div class="row">
            <div class="field"><label>Emri</label><input type="text" name="customerFirstName" required="required"/></div>
            <div class="field"><label>Mbiemri</label><input type="text" name="customerLastName" required="required"/></div>
          </div>
          <div class="field"><label>Numri i Telefonit</label><input type="text" name="customerPhone" placeholder="07x xxx xxx"/></div>

          <div class="section-label">Të Dhënat e Eventit</div>
          <div class="row">
            <div class="field"><label>Lloji i Eventit</label>
              <select name="eventType">
                <option th:each="t : ${eventTypes}" th:value="${t}" th:text="${t}"></option>
              </select>
            </div>
            <div class="field"><label>Salla</label>
              <select id="hallSelect" name="hallId">
                <option th:each="h : ${halls}" th:value="${h.id}" th:text="${h.name} + ' (kap. ' + ${h.capacity} + ')'"></option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="field"><label>Data e Eventit</label><input id="dateInput" type="date" name="eventDate" th:value="${today}" required="required"/></div>
            <div class="field"><label>Ora (format 24-orësh)</label><input type="text" name="eventTime" value="19:00" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" placeholder="p.sh. 19:00" title="Formati 24-orësh, p.sh. 19:00 ose 09:30"/></div>
          </div>
          <div class="row">
            <div class="field"><label>Numri i Mysafirëve</label><input type="number" min="1" name="guests" value="100" required="required"/></div>
            <div class="field"><label>Menuja</label>
              <select name="menuId">
                <option th:each="m : ${menus}" th:value="${m.id}" th:text="${m.name} + ' — ' + ${#numbers.formatDecimal(m.pricePerGuest,1,2)} + ' €/mysafir'"></option>
              </select>
            </div>
          </div>
          <div class="field"><label>Shënime / Kërkesa Speciale</label><textarea name="notes" rows="2"></textarea></div>

          <div id="hallWarnBox"></div>

          <button class="btn btn-primary" type="submit">Krijo Rezervimin</button>
          <a class="btn btn-ghost" th:href="@{/reservations}">Anulo</a>
        </form>
      </div>
    </div>
  </div>
</div>
<script th:inline="javascript">
  const checkUrl = /*[[@{/reservations/check-conflict}]]*/ '/reservations/check-conflict';
  const hallSelect = document.getElementById('hallSelect');
  const dateInput = document.getElementById('dateInput');
  const warnBox = document.getElementById('hallWarnBox');

  async function checkConflict() {
    if (!hallSelect || !dateInput || !dateInput.value) return;
    try {
      const res = await fetch(checkUrl + '?hallId=' + hallSelect.value + '&date=' + dateInput.value);
      const text = await res.text();
      warnBox.innerHTML = text ? '<div class="warn-box">⚠ ' + text + '</div>' : '';
    } catch (e) { /* injoro gabimet e rrjetit ne kontrollin e konfliktit */ }
  }
  if (hallSelect && dateInput) {
    hallSelect.addEventListener('change', checkConflict);
    dateInput.addEventListener('change', checkConflict);
  }
</script>
</body>
</html>
