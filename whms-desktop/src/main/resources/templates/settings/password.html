<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/common :: assets}"></th:block>
  <title>Fjalëkalimi — Pallati i Dasmave</title>
</head>
<body>
<div id="appShell">
  <div th:replace="~{fragments/common :: sidebar('settings')}"></div>
  <div class="main">
    <div class="topbar no-print">
      <div><h2>Cilësimet</h2><div class="sub">Profili i biznesit, kushtet dhe fjalëkalimi</div></div>
    </div>
    <div class="content">
      <div th:replace="~{fragments/common :: alerts}"></div>

      <div class="tabs no-print">
        <a class="tab" th:href="@{/settings/profile}">Profili i Biznesit</a>
        <a class="tab" th:href="@{/settings/terms}">Kushtet e Rezervimit</a>
        <a class="tab active" th:href="@{/settings/password}">Fjalëkalimi</a>
      </div>

      <div class="card" style="max-width:460px;">
        <form th:action="@{/settings/password}" method="post">
          <div class="field"><label>Emri i Përdoruesit Aktual</label><input type="text" th:value="${currentUsername}" disabled="disabled"/></div>
          <div class="field"><label>Emri i Ri i Përdoruesit (opsionale)</label><input type="text" name="newUsername" placeholder="Lëreni bosh për ta lënë të pandryshuar"/></div>
          <div class="field"><label>Fjalëkalimi i Ri (opsionale)</label><input type="password" name="newPassword" placeholder="Lëreni bosh për ta lënë të pandryshuar"/></div>
          <button class="btn btn-primary" type="submit">Ruaj</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
