<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/common :: assets}"></th:block>
  <title>Cilësimet — Pallati i Dasmave</title>
</head>
<body>
<div id="appShell">
  <div th:replace="~{fragments/common :: sidebar('settings')}"></div>
  <div class="main">
    <div class="topbar no-print">
      <div><h2>Cilësimet</h2><div class="sub">Profili i biznesit, kushtet dhe fjalëkalimi</div></div>
    </div>
    <div class="content">
      <div th:replace="~{fragments/common :: alerts}"></div>

      <div class="tabs no-print">
        <a class="tab active" th:href="@{/settings/profile}">Profili i Biznesit</a>
        <a class="tab" th:href="@{/settings/terms}">Kushtet e Rezervimit</a>
        <a class="tab" th:href="@{/settings/password}">Fjalëkalimi</a>
      </div>

      <div class="card" style="max-width:560px;">
        <form th:action="@{/settings/profile}" th:object="${settings}" method="post">
          <input type="hidden" th:field="*{id}"/>
          <div class="field"><label>Emri i Biznesit</label><input type="text" th:field="*{businessName}" required="required"/></div>
          <div class="field"><label>Adresa</label><input type="text" th:field="*{address}"/></div>
          <div class="row">
            <div class="field"><label>Telefoni</label><input type="text" th:field="*{phone}"/></div>
            <div class="field"><label>Email</label><input type="email" th:field="*{email}"/></div>
          </div>
          <input type="hidden" th:field="*{terms}"/>
          <button class="btn btn-primary" type="submit">Ruaj Profilin</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
